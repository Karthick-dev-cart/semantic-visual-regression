<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
  :root { --accent: #7c3aed; --accent-dark: #6d28d9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f8fafc; color: #0f172a; }
  header { background: var(--accent); color: white; padding: 24px 32px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  .nav { display: flex; gap: 20px; padding: 12px 32px; background: var(--accent-dark); }
  .nav a { color: white; text-decoration: none; font-size: 13px; opacity: 0.9; }
  main { padding: 32px; }
  .cards { display: flex; gap: 16px; }
  .card { flex: 1; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; }
  .card .label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 8px; color: var(--accent); }
  .cta { margin-top: 24px; display: inline-block; background: var(--accent); color: white; padding: 10px 18px; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <h1>Dashboard</h1>
    <p>Welcome back — here's what's happening with your account.</p>
  </header>
  <div class="nav">
    <a href="#">Overview</a>
    <a href="#">Reports</a>
    <a href="#">Team</a>
    <a href="#">Settings</a>
  </div>
  <main>
    <div class="cards">
      <div class="card"><div class="label">Active Users</div><div class="value">4,218</div></div>
      <div class="card"><div class="label">Monthly Revenue</div><div class="value">$38,902</div></div>
      <div class="card"><div class="label">Open Tickets</div><div class="value">12</div></div>
    </div>
    <a class="cta" href="#">View full report</a>
  </main>
</body>
</html>
